server {
    listen       8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 健康状态：固定 JSON，不依赖任何外部服务
    location = /healthz {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok","service":"deepsea-cable-console"}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
